<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>なわとびジャンプマスター</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>なわとびジャンプマスター</h1>
      </div>
      <div class="control-group">
        <div class="control bpm-control">
          <label for="bpm">BPM <strong id="bpmValue">96</strong></label>
          <input id="bpm" type="range" min="70" max="150" step="1" value="96" />
        </div>
        <div class="control diff-control">
          <span class="control-label">難易度</span>
          <div class="seg" role="group" aria-label="難易度選択">
            <button id="easyBtn" class="active" type="button">EASY</button>
            <button id="normalBtn" type="button">NORMAL</button>
            <button id="hardBtn" type="button">HARD</button>
          </div>
        </div>
      </div>
    </header>

    <section class="hud" aria-live="polite">
      <div class="chip">Score <b id="score">0</b></div>
      <div class="chip">Combo <b id="combo">0</b></div>
      <div class="chip">Best <b id="best">0</b></div>
      <div class="chip life-chip">Life <b id="life" class="life-hearts" aria-label="残りライフ3">❤❤❤</b></div>
      <div class="chip">Rate <b id="rate">0%</b></div>
    </section>

    <main class="stageWrap" id="stageWrap">
      <canvas id="game" aria-label="なわとびゲーム画面"></canvas>
      <div class="overlay" id="overlay">
        <div class="card" id="overlayCard">
          <h2 id="overlayTitle">タップ / Space で開始</h2>
          <p id="overlayText">リングが閉じる瞬間にタップ（縄が足元に来る直前が目安）</p>
          <div id="overlayMeta" class="overlay-meta" hidden></div>
          <div class="actions" id="overlayActions">
            <button id="startBtn" class="primary-btn" type="button">スタート</button>
            <button id="retryBtn" class="primary-btn" type="button" hidden>もう一回</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="bottom">
      <button id="jumpBtn" class="jump" type="button">JUMP</button>
      <div class="sub-actions">
        <button id="pauseBtn" type="button">一時停止</button>
        <button id="resetBtn" type="button">リセット</button>
        <button id="soundBtn" type="button" aria-pressed="true">🔊 Sound ON</button>
      </div>
    </footer>

    <p id="srStatus" class="sr-only" aria-live="assertive"></p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
